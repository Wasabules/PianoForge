[build-system]
requires = ["setuptools>=77"] # (77: the licence as an SPDX expression)
build-backend = "setuptools.build_meta"

[project]
name = "pianoforge-forge"
version = "0.1.0"
description = "PianoForge forge: analysis and calibration tools that turn the reference corpus into engine data."
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
    "numpy>=2.0",
    "soundfile>=0.12",
    "scipy>=1.13",
    "matplotlib>=3.8",       # the plots each step writes beside its measures (modes-v064.png...)
]

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools.packages.find]
include = ["forge*"]
