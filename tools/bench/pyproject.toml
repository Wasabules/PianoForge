[build-system]
requires = ["setuptools>=77"] # (77: the licence as an SPDX expression)
build-backend = "setuptools.build_meta"

[project]
name = "pianoforge-bench"
version = "0.2.0"
description = "PianoForge reference bench: plays a VST3 instrument (Kontakt) through a measurement protocol and stores the renders."
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
    "pedalboard>=0.9.26",    # VST3 host (GPL-3.0): development tool only, never linked into the engine
    "numpy>=2.0",
    "soundfile>=0.12",
    "python-rtmidi>=1.5",    # MIDI keyboard probe (MIT)
    "mido>=1.3",             # standard MIDI files for whole pieces (MIT)
]

[project.scripts]
bench = "bench.cli:main"

[tool.setuptools.packages.find]
include = ["bench*"]
