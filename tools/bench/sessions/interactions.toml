# Interactions session: sustain pedal, sympathetic resonance, half pedal, noises.
# Rendered with the same state as "reference" (noire-dry). Noire holds two recorded pianos (Pure and Felt);
# its "All Resonance" snapshot is a sound-design preset (reverb at maximum), not a string resonance switch,
# so this session measures what the library itself does with the pedal.
# Measured on 2026-11-04 (studies/noire_pedal_behavior.py): pedal-down takes carry extra energy that builds
# up after the attack (sympathetic resonance), the half pedal is progressive, and there is no pedal noise.

[session]
name = "interactions"
sample_rate = 44100  # Kontakt hosted by pedalboard always runs at 44.1 kHz (see bench/kontakt.py)

# Comparable pairs: the same note with the pedal down (key released at 4 s, pedal held until 10 s) and
# with the pedal up (key held for 10 s). The difference isolates the sympathetic resonance.
[[pass]]
name = "pedal-down"
type = "note"
notes = "A0..C8:6"
velocities = [40, 100]
pedal = "down"
preroll = 1.0
hold = 4.0
pedal_hold = 6.0
tail = 3.0

[[pass]]
name = "pedal-up"
type = "note"
notes = "A0..C8:6"
velocities = [40, 100]
preroll = 1.0
hold = 10.0
tail = 3.0

# Half pedal: CC64 lifted progressively from 127 to 0 over 4 s on a note already released.
# (The Korg B2 only sends a continuous CC64 with the optional PU-2 pedal unit; the reference tests it anyway.)
[[pass]]
name = "half-pedal"
type = "pedal_ramp"
notes = ["C2", "C4", "C6"]
velocities = [80]
ramp_duration = 4.0

[[pass]]
name = "pedal-only"
type = "pedal_only"
hold = 2.0

[[pass]]
name = "silence"
type = "silence"
duration = 5.0

# Probes of what the pedal-down / pedal-up pairs do not show (2026-11-06). The library is deterministic, so each
# interaction is a difference of takes rendered here:
#   - held keys, pedal up: (keys held + note) - (keys held) - (note alone): do held strings resonate?
#   - pedal timing, key held: pedal pressed after the note, pedal lifted while the key stays down, against the
#     note held without pedal;
#   - re-pedalling: the pedal lifted on a released note, then pressed again 0.1 or 0.3 s later, against the
#     pedal lifted for good: does the library catch what is left of the note?
[[pass]]
name = "probes"
type = "sequence"
takes = [
  { name = "held-A2v001", duration = 11.0, events = [[0.5, "on", "A2", 1], [9.5, "off", "A2"]] },
  { name = "held-A2v001_A3v100-staccato", duration = 11.0, events = [[0.5, "on", "A2", 1], [2.0, "on", "A3", 100], [2.3, "off", "A3"], [9.5, "off", "A2"]] },
  { name = "A3v100-staccato", duration = 11.0, events = [[2.0, "on", "A3", 100], [2.3, "off", "A3"]] },
  { name = "held-C3E3G3v001", duration = 11.0, events = [[0.5, "on", "C3", 1], [0.5, "on", "E3", 1], [0.5, "on", "G3", 1], [9.5, "off", "C3"], [9.5, "off", "E3"], [9.5, "off", "G3"]] },
  { name = "held-C3E3G3v001_C4v100-staccato", duration = 11.0, events = [[0.5, "on", "C3", 1], [0.5, "on", "E3", 1], [0.5, "on", "G3", 1], [2.0, "on", "C4", 100], [2.3, "off", "C4"], [9.5, "off", "C3"], [9.5, "off", "E3"], [9.5, "off", "G3"]] },
  { name = "C4v100-staccato", duration = 11.0, events = [[2.0, "on", "C4", 100], [2.3, "off", "C4"]] },
  { name = "A3v100-held", duration = 12.0, events = [[1.0, "on", "A3", 100], [9.0, "off", "A3"]] },
  { name = "A3v100-held_pedal-down-2000ms", duration = 12.0, events = [[1.0, "on", "A3", 100], [2.0, "cc", 64, 127], [9.0, "off", "A3"], [10.0, "cc", 64, 0]] },
  { name = "A3v100-held_pedal-up-3000ms", duration = 12.0, events = [[0.0, "cc", 64, 127], [1.0, "on", "A3", 100], [3.0, "cc", 64, 0], [9.0, "off", "A3"]] },
  { name = "A3v100-pedal-up-3000ms", duration = 9.0, events = [[0.0, "cc", 64, 127], [1.0, "on", "A3", 100], [1.5, "off", "A3"], [3.0, "cc", 64, 0]] },
  { name = "A3v100-pedal-up-3000ms_repedal-3100ms", duration = 9.0, events = [[0.0, "cc", 64, 127], [1.0, "on", "A3", 100], [1.5, "off", "A3"], [3.0, "cc", 64, 0], [3.1, "cc", 64, 127], [8.0, "cc", 64, 0]] },
  { name = "A3v100-pedal-up-3000ms_repedal-3300ms", duration = 9.0, events = [[0.0, "cc", 64, 127], [1.0, "on", "A3", 100], [1.5, "off", "A3"], [3.0, "cc", 64, 0], [3.3, "cc", 64, 127], [8.0, "cc", 64, 0]] },
  { name = "A1v100-pedal-up-3000ms", duration = 9.0, events = [[0.0, "cc", 64, 127], [1.0, "on", "A1", 100], [1.5, "off", "A1"], [3.0, "cc", 64, 0]] },
  { name = "A1v100-pedal-up-3000ms_repedal-3100ms", duration = 9.0, events = [[0.0, "cc", 64, 127], [1.0, "on", "A1", 100], [1.5, "off", "A1"], [3.0, "cc", 64, 0], [3.1, "cc", 64, 127], [8.0, "cc", 64, 0]] },
]
