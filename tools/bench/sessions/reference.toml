# Reference session: timbre of single notes.
# Recommended Kontakt state: a "dry" instrument (no reverb, no sympathetic resonance, no mechanical
# noises), a single microphone perspective, linear velocity curve.

[session]
name = "reference"
sample_rate = 48000

# All 127 velocities on six notes: timbre jumps reveal the actual sample layers.
[[pass]]
name = "layer-discovery"
type = "note"
notes = ["A0", "C2", "C3", "C4", "C6", "C8"]
velocities = "1..127"
hold = 5.0
tail = 2.0

# Main pass: 88 notes x 16 velocities, hold adapted to the register (piecewise-linear law).
[[pass]]
name = "single-notes"
type = "note"
notes = "A0..C8"
velocities = [8, 16, 24, 32, 40, 48, 56, 64, 72, 80, 88, 96, 104, 112, 120, 127]
hold_by_note = [["A0", 35.0], ["C4", 20.0], ["C8", 8.0]]
tail = 3.0

# Releases: one note in four, three velocities, three hold durations.
[[pass]]
name = "releases"
type = "note"
notes = "A0..C8:4"
velocities = [32, 80, 120]
holds = [0.1, 0.5, 2.0]
tail = 3.0

# Re-striking a string that is still vibrating.
[[pass]]
name = "repetitions"
type = "repetition"
notes = ["C2", "C4", "C6"]
velocities = [48, 96]
intervals = [0.05, 0.1, 0.2, 0.5]
strikes = 4

[[pass]]
name = "silence"
type = "silence"
duration = 5.0
