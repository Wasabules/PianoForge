# The browser version on GitHub Pages (https://<owner>.github.io/<repo>/): the WebAssembly module built from the
# engine, its tests run under Node, then web/site/ with the module published as it is. At every push to main that
# changes the web page or the engine, and by hand (Actions > pages > Run workflow).
#
# A standalone module with no threads: the page needs no cross-origin isolation headers, which Pages cannot send.
#
# The pianos: each published release's <name>.modal-profile.bin, with its <name>.modal-profile.json (name, piano,
# credit, licence, source), is copied next to the page and listed in profiles.json with its size and SHA-256: a page
# cannot download a release asset itself (GitHub sends no CORS header on it). Published again whenever a release is:
# the release event runs on its tag, which the github-pages environment does not let deploy (only main may), so it
# only asks for a run on main (a workflow_dispatch, which GitHub lets the workflow's own token start).
# A visitor may also give the page their own modal-profile.bin, kept in their browser, never uploaded.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "engine/**"
      - "media/**"
      - "CMakeLists.txt"
      - ".github/workflows/pages.yml"
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # (the release event's run starts the one on main)

concurrency: # one deployment at a time; a newer one waits rather than cutting the running one short
  group: pages
  cancel-in-progress: false

jobs:
  relay:
    name: "A release changed: publish from main"
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"

  build:
    name: Build the page
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: emcmake cmake -S . -B build/wasm -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build (the module, copied into web/site/)
        run: cmake --build build/wasm
      - name: Test (the engine's tests, under Node)
        env:
          PIANOFORGE_NO_TIMING: "1"
        run: ctest --test-dir build/wasm --output-on-failure
      - name: The pianos of the published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site=web/site
          echo '[]' > "$site/profiles.json"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft | not) | .tag_name' |
          while read -r tag; do
            dir="$site/profiles/$tag"
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -p '*.modal-profile.bin' -p '*.modal-profile.json' -D "$dir" 2> /dev/null < /dev/null || continue
            for meta in "$dir"/*.modal-profile.json; do
              bin="${meta%.json}.bin"
              [ -f "$meta" ] && [ -f "$bin" ] || continue
              jq --arg file "${bin#"$site"/}" --arg release "$tag" --argjson size "$(stat -c %s "$bin")" \
                 --arg sha256 "$(sha256sum "$bin" | cut -d' ' -f1)" \
                 '. + {file: $file, release: $release, size: $size, sha256: $sha256}' "$meta" > entry.json
              jq --slurpfile entry entry.json '. + $entry' "$site/profiles.json" > list.json && mv list.json "$site/profiles.json"
              rm -f "$meta"
            done
          done
          jq -r '.[] | "\(.name): \(.file), \(.size) bytes"' "$site/profiles.json"

      - name: The site
        run: |
          test -s web/site/pianoforge.wasm
          ls -lR web/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
