# Builds PianoForge and runs its tests on Windows, Ubuntu and macOS (and the forge's tests, and the WebAssembly
# build): at every push to main and every pull request once the repository is public (its Actions minutes are then
# free), and by hand at any time (Actions > build > Run workflow, or `gh workflow run build.yml`). While it is private
# (minutes counted: Windows twice, macOS ten times), a push or a pull request skips every job, so costs nothing.
# Releases: release.yml.
#
# The reference corpus and the profiles calibrated on it are never in the repository (rendered from a commercial
# library, their licence forbids passing them on): the tests that need them skip (the plugin's sound tests, the web
# module's check against the native engine). The timing checks are informative here (shared machines:
# PIANOFORGE_NO_TIMING). No OBS on these machines: the OBS plugin is not built.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency: # a newer push replaces the run still going for the same branch or pull request
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSVC)
            os: windows-2022
            preset: windows-msvc
            build: windows-release
          - name: Ubuntu (GCC)
            os: ubuntu-24.04
            preset: linux-gcc
            build: linux-release
          - name: macOS (Apple Clang, arm64)
            os: macos-14
            preset: macos-clang
            build: macos-release
    runs-on: ${{ matrix.os }}
    env:
      PIANOFORGE_NO_TIMING: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies (JUCE, ALSA; a virtual display for the plugin's host test)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libxext-dev libxrender-dev \
            libgl1-mesa-dev xvfb desktop-file-utils appstream

      - name: macOS tools
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.build }} --parallel 4

      - name: Test
        if: runner.os != 'Linux'
        run: ctest --preset ${{ matrix.build }}

      - name: Test (with a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --preset ${{ matrix.build }}

      # The Debian package, made on the oldest Ubuntu aimed at (it asks for the C library it was built against): the
      # application, its menu entry, icons and AppStream metadata, the VST3 and LV2 plugins.
      - name: Debian package and its desktop metadata
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate app/linux/org.pianoforge.PianoForge.desktop
          appstreamcli validate --no-net app/linux/org.pianoforge.PianoForge.metainfo.xml || echo "(no homepage yet)"
          cd build/linux-gcc && cpack -G DEB

      - name: Keep the Debian package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: pianoforge-deb-ubuntu-24.04
          path: build/linux-gcc/*.deb

  forge:
    name: Forge, bench and profile builder (Python)
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e tools/forge -e tools/bench -e tools/profile pytest
      - name: The forge's native kernels (C++; the tests check them against the Python reference)
        run: |
          cmake -S tools/forge/native -B build/forge-native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/forge-native
      - name: Test the forge
        run: pytest -q tools/forge/tests
      - name: 'Test the bench (no Kontakt needed: its protocol, checks, storage and SFZ player)'
        run: python -m unittest discover -s tools/bench/tests
      - name: Test the profile builder (its recipes, what it reads in a bank, its download checks)
        run: |
          python -m unittest discover -s tools/profile/tests
          pianoforge-profile doctor || true

  web:
    name: Web (WebAssembly)
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: emcmake cmake -S . -B build/wasm -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/wasm
      - name: Test (the engine's tests, under Node)
        env:
          PIANOFORGE_NO_TIMING: "1"
        run: ctest --test-dir build/wasm --output-on-failure
