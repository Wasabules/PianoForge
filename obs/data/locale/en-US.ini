Keyboard.BlackColor="Black keys"
Keyboard.LeftColor="Left hand"
Keyboard.LeftBlackColor="Left hand, black keys"
Keyboard.RightColor="Right hand"
Keyboard.RightBlackColor="Right hand, black keys"
Keyboard.HandAdaptive="Follow the hands"
Keyboard.HandAdaptive.Description="On: the hands estimated from what is played (they move along the keyboard). Off: a fixed split, the keys under it to the left hand."
Keyboard.HandSplit="Split"
Keyboard.MiddleC="middle C"
Keyboard.Glow="Glow"
Keyboard.Glow.Description="Light rising from the keys pressed, as strong as they are struck. 0: none. Without trails, the source grows by half a key's length to make room for it."
Keyboard.Flash="Flash at the strike"
Keyboard.Flash.Description="A key flashes toward white when struck, as strongly as its velocity, for a tenth of a second."
Keyboard.Afterglow="Afterglow"
Keyboard.Afterglow.Description="How long a key keeps fading once it is up. 0: it goes out at once."
Keyboard.Offset="Offset"
Keyboard.Offset.Description="Moves the keys against the sound: later if positive. Zero meets the PianoForge audio source's sound."

