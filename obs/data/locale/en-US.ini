PianoForge="PianoForge"
Module.Description="The PianoForge sources: the application's sound, its keyboard as played, its state as text, and chapter markers."

Audio.Name="PianoForge"
Keyboard.Name="PianoForge keyboard"
Keyboard.Sync="Synchronised with PianoForge (Stream look window)"
Keyboard.Sync.Description="On: this keyboard's look is the one set in PianoForge's Stream look window, and the one set here goes there too; every synchronised keyboard shares it. Off: this keyboard keeps its own."
Keyboard.Style="Style"
Keyboard.Style.Description="A whole look at once: colours, lights, sparkles, chords, bloom, reflection, ambiance (the size, the keys shown and the timing are kept). Change anything after: the style stays the starting point."
Keyboard.Style.Custom="My own"
Keyboard.Style.PianoForge="PianoForge (the defaults)"
Keyboard.Style.Concert="Concert (sober)"
Keyboard.Style.Neon="Neon"
Keyboard.Style.Galaxy="Galaxy"
Keyboard.Style.Rainbow="Rainbow"
Keyboard.Style.Minimal="Minimal"
Keyboard.Reset="Back to the defaults"
Keyboard.Reset.Description="Every setting back to its default, the width kept."
Keyboard.Board="Keyboard"
Keyboard.Range="Keys shown"
Keyboard.Range.Description="All 88 keys, a smaller keyboard's, a range of your own, or following the playing: the view glides to the keys played lately, at least so many octaves wide, and stays put while you play inside it."
Keyboard.Range.88="88 keys (A0 to C8)"
Keyboard.Range.76="76 keys (E1 to G7)"
Keyboard.Range.61="61 keys (C2 to C7)"
Keyboard.Range.49="49 keys (C2 to C6)"
Keyboard.Range.37="37 keys (C3 to C6)"
Keyboard.Range.Custom="From one key to another"
Keyboard.Range.Follow="Following the playing"
Keyboard.RangeFirst="From"
Keyboard.RangeLast="To"
Keyboard.FollowOctaves="At least (octaves)"
Keyboard.FollowOctaves.Description="Following the playing: the view is never narrower than this."
Keyboard.Colours="Colours"
Keyboard.Notes="Notes"
Keyboard.PedalTails="Notes held by the pedals"
Keyboard.PedalTails.Description="A note whose key is up but which a pedal still holds goes on as a fainter tail until the pedal lets it go (or the key is struck again); then its end draws in and fades out."
Keyboard.TailWidth="Tails: width"
Keyboard.TailWidth.Description="A tail's width, as a share of its note's."
Keyboard.TailOpacity="Tails: opacity"
Keyboard.TailOpacity.Description="How much a tail shows, as a share of its note's opacity."
Keyboard.TailFine="Tails: fine end"
Keyboard.TailFine.Description="How thin and faint a tail's end becomes once the pedal has let it go: 0 a blunt end, 100 a point fading to nothing."
Keyboard.PedalLine="Pedal line"
Keyboard.PedalLine.Description="A thin line of light along the top of the keyboard while the sustain pedal is down, in the pedals' colour. 0: none."
Keyboard.PedalGlow="Pedal halo"
Keyboard.PedalGlow.Description="A soft light rising from the top of the keyboard over the notes' feet while the sustain pedal is down. 0: none."
Keyboard.NoteDecay="Notes die away"
Keyboard.NoteDecay.Description="Along its bar, a note dims as its sound would: slowly in the bass, quickly in the treble."
Keyboard.Melody="Melody line"
Keyboard.Melody.Description="A line of light through the right hand's top notes, brighter where struck harder: the melody drawn above the chords."
Keyboard.Lights="Lights"
Keyboard.Bloom="Bloom"
Keyboard.Bloom.Description="The lights, the notes and the keys lit glow beyond themselves, softly, as in a photograph (the white keys do not). 0: none."
Keyboard.Reflection="Reflection"
Keyboard.Reflection.Description="The band over the keys becomes black lacquer, reflecting the notes and lights above it. 0: a thin rail."
Keyboard.Ambiance="Aurora (ambiance)"
Keyboard.Ambiance.Description="Curtains of light over the room, swaying, as strong as the playing is loud (PianoForge's sound). 0: none."
Keyboard.AuroraHeight="Aurora: height"
Keyboard.AuroraHeight.Description="How high its curtains rise, as a share of the room above the keys."
Keyboard.AuroraSpeed="Aurora: speed"
Keyboard.AuroraSpeed.Description="How fast its curtains sway. 0: still; 50: as made."
Keyboard.AuroraRest="Aurora: at rest"
Keyboard.AuroraRest.Description="How much of it stays when nothing sounds: 0 it follows the sound alone, 100 always at full strength."
Keyboard.SparklesGroup="Sparkles"
Text.Name="PianoForge text"

Status.NoApplication="Waiting for PianoForge: start the application (with this plugin's version or later)."
Status.NoAudio="PianoForge is open, but its audio is stopped (no audio device, or the device restarting)."
Status.Connected="PianoForge connected: %.1f kHz into OBS at %.1f kHz, blocks of %.0f (%.1f ms)."
Status.Measures="Latency: %.1f ms aimed at, %.1f ms waiting; from the key to OBS: %.0f ms; drift %+.0f ppm; resyncs: %u."
Status.Limiter="The limiter acts: down to %.1f dB in the last seconds (lower the gain)."
Status.Starting="Starting (filling the buffer)..."
Status.Running="Running for %.0f min %.0f s."

Refresh="Refresh the status"
Mix="Mix"
Mix.Heard="As heard in PianoForge (on headphones: the binaural rendering)"
Mix.Speakers="On speakers (the room without the head)"
Mix.Dry="Dry (the piano without the room)"
Mix.Description="What the stream gets. On speakers: the room as speakers give it, even while PianoForge is heard on headphones (a binaural rendering is made for headphones, and colours the sound on speakers). As heard: exactly what PianoForge plays. Dry: the piano alone, for a room or effects of OBS's."
FollowVolume="Follow PianoForge's volume"
FollowVolume.Description="Off: the stream keeps its level whatever volume you listen at in PianoForge."
Gain="Gain"
Gain.Description="The stream's level, after which a limiter keeps the peaks under -1 dBFS."
Latency="Latency"
Latency.Description="Audio kept waiting between PianoForge and OBS. Lower: closer to the sound you hear; higher: safer on a busy machine. Below the two sides' block sizes it cannot go (about 10 ms with 128-sample blocks)."
Resync="Resynchronise"
Chapters="Chapter markers in OBS recordings"
Chapters.Description="At each take saved, recording started or stopped, and MIDI file played in PianoForge, a chapter in OBS's recording (OBS 30.2 and later, recordings in Hybrid MP4)."
Control="Let PianoForge's gestures control OBS"
Control.Description="Gestures played on PianoForge's keyboard (chosen in PianoForge: Keyboard > Piano gestures) start or stop OBS's recording or stream, add a chapter marker, or move to the next or previous scene."
Help="Volume, mono, sync offset and monitoring: in OBS's Advanced Audio Properties; effects: in the source's Filters. Turn monitoring off so that PianoForge is not heard twice. A camera's image reaches OBS later than the scene it shows (often 50 to 150 ms): to meet it, delay this source by the difference against the latency from the key to OBS below (Sync Offset)."

Keyboard.Status.Waiting="Waiting for PianoForge: start the application."
Keyboard.Status.Following="Following the PianoForge audio source: the keys move with its sound."
Keyboard.Status.Alone="No PianoForge audio source: the keys follow the application, 20 ms behind it. Add the audio source and they meet its sound."
Keyboard.Width="Width"
Keyboard.TrailHeight="Notes above the keys"
Keyboard.TrailHeight.Description="Each note rises from its key as a rounded bar, as long as it is held, fading toward the top. 0: the keyboard alone."
Keyboard.TrailSeconds="Time to the top"
Keyboard.Pedals="The pedals (soft, sostenuto, sustain)"
Keyboard.ColorMode="Colours"
Keyboard.ColorMode.Hands="Left and right hands (estimated)"
Keyboard.ColorMode.Keys="White and black keys"
Keyboard.ColorMode.Single="One colour"
Keyboard.ColorMode.Rainbow="Rainbow along the keyboard"
Keyboard.ColorMode.Description="The keys pressed, their notes and their light: each hand's hue, estimated from the notes (where each hand plays, how far it stretches, chords too wide for one hand split); a hue for the white keys and one for the black; one for all; or the rainbow, from red in the bass to violet in the treble. The black keys take a deeper shade of their hue."
Keyboard.Hue.Description="The hue on the colour wheel: 0 red, 30 orange, 60 yellow, 120 green, 180 cyan, 215 blue, 270 violet, 320 pink."
Keyboard.HueLeft="Left hand (hue)"
Keyboard.HueRight="Right hand (hue)"
Keyboard.HueWhite="White keys (hue)"
Keyboard.HueBlack="Black keys (hue)"
Keyboard.HueSingle="Hue"
Keyboard.Saturation="Saturation"
Keyboard.Saturation.Description="How vivid the colours are: 0 grey, 100 the purest."
Keyboard.HandAdaptive="Follow the hands"
Keyboard.HandAdaptive.Description="On: the hands estimated from what is played (they move along the keyboard). Off: a fixed split, the keys under it to the left hand."
Keyboard.HandSplit="Split"
Keyboard.MiddleC="middle C"
Keyboard.Glow="Lights"
Keyboard.Glow.Description="Beams rising from the keys held, halos around the notes, the keys lit from within, as strong as they are struck. 0: none. Without notes above the keys, the source grows by more than half a key's length to make room for the lights and the sparkles."
Keyboard.Sparkles="Sparkles"
Keyboard.Sparkles.Description="Sparkles thrown up by each strike in a short stream, the more and the higher the stronger it is, and a few rising while a key is held. 0: none."
Keyboard.SparkleHeight="Sparkles: height"
Keyboard.SparkleHeight.Description="How high the sparkles rise, as a share of the room above the keys (for the strongest strikes; softer ones go less high)."
Keyboard.SparkleSpread="Sparkles: spread"
Keyboard.SparkleSpread.Description="The angle they leave within, each side of their direction: 0 a thread straight up, 90 a wide fountain."
Keyboard.SparkleTilt="Sparkles: direction"
Keyboard.SparkleTilt.Description="Leans them to the left (negative) or to the right (positive), as in a breeze. 0: straight up."
Keyboard.Flash="Burst at the strike"
Keyboard.Flash.Description="A burst of light where a key is struck, a flare along the keyboard and the key lit from within, as strong as its velocity, for a tenth of a second."
Keyboard.Afterglow="Afterglow"
Keyboard.Afterglow.Description="How long a key keeps fading once it is up. 0: it goes out at once."
Keyboard.Velocity="Velocity"
Keyboard.Accent="Accent"
Keyboard.Accent.Description="How much each strike's strength shows: soft notes thinner, deeper and more transparent, strong ones wider, with a white-hot core and a wider halo; a ripple of light from the key at the strike. 0: no more than the keys' light."
Keyboard.VelocityTop="Strongest velocity"
Keyboard.VelocityTop.Description="The velocity shown at full strength: your keyboard's strongest (a Korg B2 seldom goes past 112; others reach 127). Stronger strikes show as full strength."
Keyboard.VelocityMeasure="Take my strongest strike of the last minute"
Keyboard.VelocityMeasure.Description="Play a few of your strongest notes, then press: the strongest velocity of the last minute becomes the strongest velocity."
Keyboard.Chords="Powerful chords"
Keyboard.Chords.Description="A chord struck together and hard (as many notes as set, their mean strength over the threshold) becomes an event. After one, the next waits 0.6 s: a fortissimo passage is not a firework at every chord."
Keyboard.ChordNotes="Notes at least"
Keyboard.ChordThreshold="Strength threshold"
Keyboard.ChordThreshold.Description="The chord's mean strength, against the strongest velocity: 75 % is a mean velocity of 84 when the strongest is 112."
Keyboard.ChordIntensity="Intensity"
Keyboard.ChordWave="A wave of light along the keyboard"
Keyboard.ChordWash="The room above the keys lit"
Keyboard.ChordFireworks="Fireworks"
Keyboard.ChordBracket="The chord's notes tied by a bar of light"
Keyboard.ChordShake="The keyboard shakes"
Keyboard.Offset="Offset"
Keyboard.Offset.Description="Moves the keys against the sound: later if positive. Zero meets the PianoForge audio source's sound."

