PianoForge="PianoForge"
Module.Description="Les sources PianoForge : le son de l'application, son clavier tel qu'il est joué, son état en texte, et des marqueurs de chapitre."

Audio.Name="PianoForge"
Keyboard.Name="Clavier PianoForge"
Keyboard.Style="Style"
Keyboard.Style.Description="Tout un rendu d'un coup : couleurs, lumières, paillettes, accords, bloom, reflet, ambiance (la taille, les touches affichées et le minutage sont gardés). Change ensuite ce que tu veux : le style reste le point de départ."
Keyboard.Style.Custom="Le mien"
Keyboard.Style.PianoForge="PianoForge (par défaut)"
Keyboard.Style.Concert="Concert (sobre)"
Keyboard.Style.Neon="Néon"
Keyboard.Style.Galaxy="Galaxie"
Keyboard.Style.Rainbow="Arc-en-ciel"
Keyboard.Style.Minimal="Minimal"
Keyboard.Reset="Revenir aux réglages par défaut"
Keyboard.Reset.Description="Tous les réglages reviennent à leur valeur par défaut, la largeur gardée."
Keyboard.Board="Clavier"
Keyboard.Range="Touches affichées"
Keyboard.Range.Description="Les 88 touches, celles d'un clavier plus petit, une plage à toi, ou suivre le jeu : la vue glisse vers les touches jouées récemment, large d'au moins quelques octaves, et ne bouge pas tant que tu joues à l'intérieur."
Keyboard.Range.88="88 touches (la0 à do8)"
Keyboard.Range.76="76 touches (mi1 à sol7)"
Keyboard.Range.61="61 touches (do2 à do7)"
Keyboard.Range.49="49 touches (do2 à do6)"
Keyboard.Range.37="37 touches (do3 à do6)"
Keyboard.Range.Custom="D'une touche à une autre"
Keyboard.Range.Follow="Suivre le jeu"
Keyboard.RangeFirst="De"
Keyboard.RangeLast="À"
Keyboard.FollowOctaves="Au moins (octaves)"
Keyboard.FollowOctaves.Description="En suivant le jeu, la vue n'est jamais plus étroite que cela."
Keyboard.Colours="Couleurs"
Keyboard.Notes="Notes"
Keyboard.PedalTails="Notes tenues par les pédales"
Keyboard.PedalTails.Description="Une note dont la touche est relâchée mais qu'une pédale tient encore continue en traîne plus pâle, jusqu'à ce que la pédale la lâche (ou que la touche soit refrappée) ; sa fin s'affine alors et s'estompe."
Keyboard.TailWidth="Traînes : largeur"
Keyboard.TailWidth.Description="La largeur d'une traîne, en part de celle de sa note."
Keyboard.TailOpacity="Traînes : opacité"
Keyboard.TailOpacity.Description="À quel point une traîne se voit, en part de l'opacité de sa note."
Keyboard.TailFine="Traînes : fin effilée"
Keyboard.TailFine.Description="À quel point la fin d'une traîne s'affine et s'estompe une fois que la pédale l'a lâchée : 0 une fin franche, 100 une pointe qui disparaît."
Keyboard.PedalLine="Ligne de la pédale"
Keyboard.PedalLine.Description="Une ligne de lumière le long du haut du clavier tant que la pédale forte est enfoncée, de la couleur des pédales. 0 : aucune."
Keyboard.NoteDecay="Les notes s'éteignent"
Keyboard.NoteDecay.Description="Le long de sa barre, une note faiblit comme son son : lentement dans les graves, vite dans les aigus."
Keyboard.Melody="Ligne mélodique"
Keyboard.Melody.Description="Une ligne de lumière relie les notes du dessus de la main droite, plus vive là où elles sont frappées fort : la mélodie dessinée au-dessus des accords."
Keyboard.Lights="Lumières"
Keyboard.Bloom="Bloom (diffusion)"
Keyboard.Bloom.Description="Les lumières, les notes et les touches éclairées rayonnent au-delà d'elles-mêmes, doucement, comme sur une photo (pas les touches blanches). 0 : aucun."
Keyboard.Reflection="Reflet"
Keyboard.Reflection.Description="La bande au-dessus des touches devient une laque noire qui reflète les notes et les lumières au-dessus. 0 : un rail fin."
Keyboard.Ambiance="Ambiance"
Keyboard.Ambiance.Description="Des voiles de lumière ondulent au-dessus des touches, d'autant plus forts que le jeu est fort (le son de PianoForge). 0 : aucun."
Keyboard.SparklesGroup="Paillettes"
Text.Name="Texte PianoForge"

Status.NoApplication="En attente de PianoForge : lancez l'application (de la version de ce plugin ou plus récente)."
Status.NoAudio="PianoForge est ouvert, mais son audio est arrêté (pas de périphérique audio, ou périphérique en redémarrage)."
Status.Connected="PianoForge connecté : %.1f kHz vers OBS à %.1f kHz, blocs de %.0f (%.1f ms)."
Status.Measures="Latence : %.1f ms visées, %.1f ms en attente ; de la touche à OBS : %.0f ms ; dérive %+.0f ppm ; resynchronisations : %u."
Status.Limiter="Le limiteur agit : jusqu'à %.1f dB ces dernières secondes (baissez le gain)."
Status.Starting="Démarrage (remplissage du tampon)..."
Status.Running="En marche depuis %.0f min %.0f s."

Refresh="Actualiser l'état"
Mix="Mix"
Mix.Heard="Tel qu'entendu dans PianoForge (au casque : le rendu binaural)"
Mix.Speakers="Sur enceintes (la salle sans la tête)"
Mix.Dry="Sec (le piano sans la salle)"
Mix.Description="Ce que reçoit le stream. Sur enceintes : la salle telle que des enceintes la donnent, même quand PianoForge est écouté au casque (un rendu binaural est fait pour le casque, et colore le son sur des enceintes). Tel qu'entendu : exactement ce que joue PianoForge. Sec : le piano seul, pour une salle ou des effets d'OBS."
FollowVolume="Suivre le volume de PianoForge"
FollowVolume.Description="Désactivé : le stream garde son niveau quel que soit le volume d'écoute dans PianoForge."
Gain="Gain"
Gain.Description="Le niveau du stream, après lequel un limiteur garde les crêtes sous -1 dBFS."
Latency="Latence"
Latency.Description="Audio mis en attente entre PianoForge et OBS. Plus bas : plus proche du son entendu ; plus haut : plus sûr sur une machine chargée. Elle ne peut descendre sous ce qu'exigent les blocs des deux côtés (environ 10 ms avec des blocs de 128 échantillons)."
Resync="Resynchroniser"
Chapters="Marqueurs de chapitre dans les enregistrements d'OBS"
Chapters.Description="À chaque prise sauvegardée, enregistrement lancé ou arrêté, et fichier MIDI joué dans PianoForge, un chapitre dans l'enregistrement d'OBS (OBS 30.2 et plus récent, enregistrements en MP4 hybride)."
Control="Laisser les gestes de PianoForge piloter OBS"
Control.Description="Des gestes joués sur le clavier de PianoForge (choisis dans PianoForge : Keyboard > Piano gestures) lancent ou arrêtent l'enregistrement ou le stream d'OBS, ajoutent un marqueur de chapitre, ou passent à la scène suivante ou précédente."
Help="Volume, mono, décalage de synchronisation et monitoring : dans les Propriétés audio avancées d'OBS ; effets : dans les Filtres de la source. Désactivez le monitoring pour ne pas entendre PianoForge deux fois. L'image d'une caméra arrive dans OBS après la scène qu'elle montre (souvent de 50 à 150 ms) : pour la rejoindre, retardez cette source de la différence avec la latence de la touche à OBS ci-dessous (Décalage de synchronisation)."

Keyboard.Status.Waiting="En attente de PianoForge : lancez l'application."
Keyboard.Status.Following="Suit la source audio PianoForge : les touches bougent avec son son."
Keyboard.Status.Alone="Pas de source audio PianoForge : les touches suivent l'application, 20 ms derrière elle. Ajoutez la source audio, et elles rejoignent son son."
Keyboard.Width="Largeur"
Keyboard.TrailHeight="Notes au-dessus des touches"
Keyboard.TrailHeight.Description="Chaque note monte de sa touche en barre arrondie, aussi longue qu'elle est tenue, et s'estompe vers le haut. 0 : le clavier seul."
Keyboard.TrailSeconds="Temps de montée jusqu'en haut"
Keyboard.Pedals="Les pédales (douce, tonale, forte)"
Keyboard.ColorMode="Couleurs"
Keyboard.ColorMode.Hands="Main gauche et main droite (estimées)"
Keyboard.ColorMode.Keys="Touches blanches et touches noires"
Keyboard.ColorMode.Single="Une couleur"
Keyboard.ColorMode.Rainbow="Arc-en-ciel le long du clavier"
Keyboard.ColorMode.Description="Les touches enfoncées, leurs notes et leur lumière : la teinte de chaque main, estimée d'après les notes (où joue chaque main, jusqu'où elle s'écarte, les accords trop larges pour une main partagés) ; une teinte pour les touches blanches et une pour les noires ; une pour toutes ; ou l'arc-en-ciel, du rouge dans les graves au violet dans les aigus. Les touches noires prennent une nuance plus profonde de leur teinte."
Keyboard.Hue.Description="La teinte sur le cercle des couleurs : 0 rouge, 30 orange, 60 jaune, 120 vert, 180 cyan, 215 bleu, 270 violet, 320 rose."
Keyboard.HueLeft="Main gauche (teinte)"
Keyboard.HueRight="Main droite (teinte)"
Keyboard.HueWhite="Touches blanches (teinte)"
Keyboard.HueBlack="Touches noires (teinte)"
Keyboard.HueSingle="Teinte"
Keyboard.Saturation="Saturation"
Keyboard.Saturation.Description="La vivacité des couleurs : 0 gris, 100 les plus pures."
Keyboard.HandAdaptive="Suivre les mains"
Keyboard.HandAdaptive.Description="Activé : les mains estimées d'après ce qui est joué (elles se déplacent sur le clavier). Désactivé : un partage fixe, les touches en dessous à la main gauche."
Keyboard.HandSplit="Partage"
Keyboard.MiddleC="do central"
Keyboard.Glow="Lumières"
Keyboard.Glow.Description="Des faisceaux qui montent des touches tenues, un halo autour des notes, les touches éclairées de l'intérieur, aussi forts que la frappe. 0 : aucun. Sans notes au-dessus des touches, la source grandit d'un peu plus d'une demi-longueur de touche pour faire place aux lumières et aux paillettes."
Keyboard.Sparkles="Paillettes"
Keyboard.Sparkles.Description="Des paillettes jaillissent à chaque frappe en un court filet, d'autant plus nombreuses et plus haut qu'elle est forte, et quelques-unes montent tant qu'une touche est tenue. 0 : aucune."
Keyboard.SparkleHeight="Paillettes : hauteur"
Keyboard.SparkleHeight.Description="Jusqu'où montent les paillettes, en part de la place au-dessus des touches (pour les frappes les plus fortes ; les plus douces montent moins haut)."
Keyboard.SparkleSpread="Paillettes : ouverture"
Keyboard.SparkleSpread.Description="L'angle dans lequel elles partent, de chaque côté de leur direction : 0 un fil tout droit, 90 une large fontaine."
Keyboard.SparkleTilt="Paillettes : direction"
Keyboard.SparkleTilt.Description="Les penche vers la gauche (négatif) ou vers la droite (positif), comme dans une brise. 0 : tout droit."
Keyboard.Flash="Éclat à la frappe"
Keyboard.Flash.Description="Un éclat de lumière là où une touche est frappée, un reflet le long du clavier et la touche éclairée de l'intérieur, aussi forts que la vélocité, pendant un dixième de seconde."
Keyboard.Afterglow="Rémanence"
Keyboard.Afterglow.Description="Combien de temps une touche relâchée met à s'éteindre. 0 : elle s'éteint aussitôt."
Keyboard.Velocity="Vélocité"
Keyboard.Accent="Accent"
Keyboard.Accent.Description="À quel point la force de chaque frappe se voit : notes douces plus fines, plus profondes et plus transparentes, notes fortes plus larges, avec un cœur chauffé à blanc et un halo plus large ; une onde de lumière part de la touche à la frappe. 0 : rien de plus que la lumière des touches."
Keyboard.VelocityTop="Vélocité la plus forte"
Keyboard.VelocityTop.Description="La vélocité affichée à pleine force : la plus forte de ton clavier (un Korg B2 dépasse rarement 112 ; d'autres atteignent 127). Les frappes plus fortes s'affichent à pleine force."
Keyboard.VelocityMeasure="Prendre ma frappe la plus forte de la dernière minute"
Keyboard.VelocityMeasure.Description="Joue quelques notes aussi fort que tu peux, puis appuie : la vélocité la plus forte de la dernière minute devient la vélocité la plus forte."
Keyboard.Chords="Accords puissants"
Keyboard.Chords.Description="Un accord frappé ensemble et fort (autant de notes que demandé, leur force moyenne au-dessus du seuil) devient un événement. Après un, le suivant attend 0,6 s : un passage fortissimo n'est pas un feu d'artifice à chaque accord."
Keyboard.ChordNotes="Notes au moins"
Keyboard.ChordThreshold="Seuil de force"
Keyboard.ChordThreshold.Description="La force moyenne de l'accord, rapportée à la vélocité la plus forte : 75 %, c'est une vélocité moyenne de 84 quand la plus forte est 112."
Keyboard.ChordIntensity="Intensité"
Keyboard.ChordWave="Une onde de lumière le long du clavier"
Keyboard.ChordWash="L'espace au-dessus des touches illuminé"
Keyboard.ChordFireworks="Feu d'artifice"
Keyboard.ChordBracket="Les notes de l'accord reliées par une barre de lumière"
Keyboard.ChordShake="Le clavier tremble"
Keyboard.Offset="Décalage"
Keyboard.Offset.Description="Déplace les touches par rapport au son : plus tard si positif. Zéro rejoint le son de la source audio PianoForge."

